# Compound step automation — proposes context updates for everything merged
# to main since the last successful run. Context changes are PRs reviewed by
# the context steward, never silent writes.
#
# Runs on repository_dispatch (from scheduler-dispatch.yml), not push:
# anthropics/claude-code-action@v1 doesn't support the push event at all
# (confirmed by a real failed run, "Unsupported event type: push"). Batching
# daily rather than reacting per-merge isn't just a workaround for that
# limitation - it also avoids a real race: two merges landing close together
# would otherwise trigger two gardener runs that each branch off a slightly
# stale HEAD and can open conflicting PRs. Diffing from the last successful
# run's commit (not just HEAD~1) means every merge since then gets covered
# exactly once, regardless of how many landed since the last check.
name: context-gardener
on:
  repository_dispatch:
    types: [context-maintenance]
  workflow_dispatch: {}

jobs:
  garden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read    # to look up the last successful run's commit below
      id-token: write  # claude-code-action needs this to fetch its own
                       # OIDC token - confirmed live: without it, the action
                       # fails immediately ("Could not fetch an OIDC token")
                       # before it even reaches ANTHROPIC_API_KEY. Missing
                       # from the original template; ai-pr-review.yml's
                       # template already had it, this one and
                       # context-drift-check.yml's didn't.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity for the commit this run will make
        run: |
          git config --global user.name "claude-context-gardener[bot]"
          git config --global user.email "claude-context-gardener[bot]@users.noreply.github.com"

      - name: Determine range since last successful run
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_SHA=$(gh run list --workflow=context-gardener.yml --status=success \
            --json headSha --limit 1 --jq '.[0].headSha // empty' 2>/dev/null || true)
          if [ -z "$LAST_SHA" ] || ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
            echo "No usable previous successful run - falling back to HEAD~1" >&2
            LAST_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "since=$LAST_SHA" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the context gardener. Examine every commit merged to main
            since the last successful gardener run:
            `git log ${{ steps.range.outputs.since }}..HEAD --stat` and
            `git diff ${{ steps.range.outputs.since }} HEAD`.
            If that range is empty, exit without doing anything else.

            1. For each OpenSpec change in that range whose tasks are now
               complete, archive it (openspec/changes/archive/) and update
               openspec/specs/.
            2. Diff reality vs context/: did these commits introduce a new
               convention, dependency, integration, structural change, or
               concern? Update the matching context file(s); bump
               `last_verified` ONLY for files you actually verified against
               the code.
            3. Mine each merged PR's review comments (gh pr view --comments)
               for recurring-rule candidates; add LEARNINGS.md entries per
               its format.
            4. If nothing needs updating, exit without creating a branch.

            Deliver everything as ONE branch `context/gardener-${{ github.sha }}`
            and open a PR titled "context: post-merge updates (<short-sha>)" with a
            bullet summary. Keep the diff minimal — small PRs get reviewed, big ones rot.
          # Bash(mv:*)/Bash(mkdir:*) added after a real run hit 4 permission
          # denials and silently reported "nothing to update" instead of
          # completing the archive step its own prompt asks for first -
          # the original allowlist had no way to actually move a folder to
          # openspec/changes/archive/.
          claude_args: '--allowedTools "Bash(git:*),Bash(gh pr:*),Bash(openspec:*),Bash(mv:*),Bash(mkdir:*),Read,Write,Edit,Grep,Glob"'

      # Checks the deterministic branch name the prompt above always uses
      # for a real PR, rather than notifying on every success() regardless
      # of whether anything happened - added after two weekend runs (Sat/Sun,
      # nothing changed on main either day) each posted the same "if opened"
      # message with nothing to actually review, confirmed via run history.
      - name: Check whether a context PR was actually opened
        id: check_pr
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr list --head "context/gardener-${{ github.sha }}" --json url --jq '.[0].url // empty')
          echo "opened=$([ -n "$PR_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - uses: slackapi/slack-github-action@v2
        if: steps.check_pr.outputs.opened == 'true'
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_PIPELINE }}
          webhook-type: incoming-webhook
          payload: |
            text: "Context-gardener opened a PR for `${{ github.sha }}` — steward review needed: ${{ steps.check_pr.outputs.pr_url }}"
