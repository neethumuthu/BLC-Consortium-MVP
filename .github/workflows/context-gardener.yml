# Compound step automation — proposes context updates after every merge to main.
# Context changes are PRs reviewed by the context steward, never silent writes.
name: context-gardener
on:
  push:
    branches: [main]

jobs:
  garden:
    # Skip the gardener's own merges to avoid loops
    if: "!startsWith(github.event.head_commit.message, 'context:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the context gardener. Examine the just-merged commit(s):
            `git log -1 --stat` and `git diff HEAD~1 HEAD`.

            1. If the merge implements an OpenSpec change whose tasks are complete,
               archive it (openspec/changes/archive/) and update openspec/specs/.
            2. Diff reality vs context/: did this merge introduce a new convention,
               dependency, integration, structural change, or concern? Update the
               matching context file(s); bump `last_verified` ONLY for files you
               actually verified against the code.
            3. Mine the PR review comments (gh pr view --comments) for recurring-rule
               candidates; add LEARNINGS.md entries per its format.
            4. If nothing needs updating, exit without creating a branch.

            Deliver everything as ONE branch `context/gardener-${{ github.sha }}`
            and open a PR titled "context: post-merge updates (<short-sha>)" with a
            bullet summary. Keep the diff minimal — small PRs get reviewed, big ones rot.
          claude_args: '--allowedTools "Bash(git:*),Bash(gh pr:*),Bash(openspec:*),Read,Write,Edit,Grep,Glob"'

      - uses: slackapi/slack-github-action@v2
        if: success()
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_PIPELINE }}
          webhook-type: incoming-webhook
          payload: |
            text: "Context-gardener ran for `${{ github.sha }}` — if a context PR was opened, steward review needed: ${{ github.server_url }}/${{ github.repository }}/pulls?q=is%3Apr+is%3Aopen+label%3Acontext"
