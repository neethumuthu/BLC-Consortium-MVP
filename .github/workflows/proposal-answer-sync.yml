# When the PM replies "@claude <answer>" on one of requirements-nudge.yml's
# "Open question: <id>" issues, resolves that change's proposal.md Open
# questions section with the answer and opens a PR for review - never
# pushes directly to main. Deliberately does NOT touch tasks.md, design.md,
# or any implementation code, and does NOT resume implementation - scope is
# "automate the requirements update," nothing more, per product decision.
#
# Kept separate from ai-pr-review.yml (Ring 2 PR review + its own general
# @claude handling) rather than folded into it - two genuinely different
# tasks triggered by the same "@claude" keyword would mean one prompt has to
# disambiguate intent every time; a dedicated, narrowly-scoped workflow can't
# misfire into the wrong behavior.
name: proposal-answer-sync
on:
  issue_comment:
    types: [created]

jobs:
  sync:
    # issue_comment fires for PR discussion threads too (they show up as
    # "issues" with a pull_request key) - excluded explicitly so this never
    # runs on a PR conversation, only on our own tracking issues.
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@claude') &&
      startsWith(github.event.issue.title, 'Open question: ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity for the commit this run will make
        run: |
          git config --global user.name "claude-requirements-sync[bot]"
          git config --global user.email "claude-requirements-sync[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A PM has answered an open product question. Context:
            - This repo uses OpenSpec changes under openspec/changes/<id>/.
            - The triggering GitHub issue is titled "Open question: <id>" -
              read the real id from this issue's actual title.
            - The issue body contains the original question and a link to
              the change's proposal.md.
            - The triggering comment (the one that mentioned you) contains
              the PM's answer - read it from this issue's latest comment.
            - You already know which issue triggered this run from your own
              GitHub Actions event context - do not run env, printenv, or
              gh issue list to rediscover the issue number. Go straight to
              gh issue view <number> --json number,title,body,comments using
              the number you already have.

            Task:
            1. Read openspec/changes/<id>/proposal.md (using the real id).
            2. Resolve its "## Open questions" section using the PM's answer:
               replace the open question text with a short note recording
               the decision and citing this issue as the source (e.g.
               "Resolved via issue #<N>: <answer summary>"), or clear the
               section entirely if nothing remains unresolved.
            3. Do NOT modify tasks.md, design.md, specs/, or any
               implementation code - only proposal.md's Open questions
               section. Do not attempt to resume or continue implementation
               - that is explicitly out of scope for this workflow.
            4. Create a new branch, commit just that one change, push it, and
               open a pull request against main with a clear title and a
               body explaining which issue/comment it resolves. Never push
               directly to main.
            5. Post a short comment on this issue linking the PR you opened.

            If the issue title doesn't match the "Open question: <id>"
            pattern, or that change folder doesn't exist, or the proposal has
            no non-empty Open questions section to resolve, stop and post a
            comment on the issue explaining why, rather than guessing or
            forcing a change.
          # Grep/Glob and the read-only Bash entries added after two live runs
          # in a row denied every exploratory command Claude tried (18 denials
          # over 28 turns the first time, 2 denials over 3 turns - then it gave
          # up - the second) and posted nothing, neither the real edit nor even
          # the workflow's own "stop and comment why" guardrail path. Same root
          # cause ai-pr-review.yml's allowlist comment already describes:
          # without something to orient with, exploratory commands get denied
          # and the run silently goes nowhere.
          #
          # 2026-08-18 (issue #38): recurred a third time, 3 denials over 4
          # turns, no PR/comment - confirmed via a full-output diagnostic run
          # (then reverted) that all 3 were self-discovery attempts (env,
          # printenv, echo $ISSUE_NUMBER, gh issue list) trying to find the
          # triggering issue number, none of which are allowed. A second,
          # full-output retry succeeded anyway (25 turns, found the number
          # via context it already had) but wasted most of its turn budget
          # getting there first. Fixed the same way as ai-pr-review.yml's own
          # fix: told the prompt explicitly that the issue number is already
          # known from context, removing the reason to explore for it.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git diff:*),Bash(gh issue view:*),Bash(find:*),Edit,Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh issue comment:*)"'
