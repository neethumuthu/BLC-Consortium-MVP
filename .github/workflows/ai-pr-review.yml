# Ring 2 — agentic PR review + interactive @claude
name: ai-pr-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]          # @claude mentions in issues/PRs
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # issue_comment also fires on our own "Open question: <id>" tracking
    # issues - excluded explicitly so an @claude <answer> reply there is
    # handled exactly once, by proposal-answer-sync.yml, not also here.
    if: |
      github.event_name == 'pull_request' ||
      (contains(github.event.comment.body, '@claude') &&
       !startsWith(github.event.issue.title, 'Open question: '))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Temporary diagnostic for issue #27 (2 reproducible silent-no-ops,
          # 2026-08-17) - same technique already used and reverted for the
          # 2026-08-12 recurrence of this exact symptom (see ERROR_LOG.md).
          # Remove once root-caused.
          show_full_output: true
          # PR #9 (context-gardener's first real PR) failed with "Workflow
          # initiated by non-human actor: claude (type: Bot)" - the action
          # refuses to act on any PR whose author isn't human unless its bot
          # username is explicitly allowed. context-gardener.yml opens its
          # PRs as exactly that bot identity, so every PR it ever opens
          # would fail this review permanently without this. Named
          # explicitly ("claude", not "*") rather than trusting every bot -
          # no reason to widen this further than the one bot this repo
          # actually runs.
          allowed_bots: "claude"
          # On @claude mentions the action handles the request interactively.
          # On PR events, run the structured Ring 2 review:
          prompt: |
            ${{ github.event_name == 'pull_request' && 'Review this PR as the Ring 2 agent.
            Load AGENTS.md, context/rules/, context/codebase/CONVENTIONS.md,
            context/decisions/ and the linked change folder under openspec/changes/.
            Check, in order:
            1. Conformance to rules/ and CONVENTIONS.md (cite the violated rule).
            2. Consistency with accepted ADRs.
            3. Regressions against openspec/specs/ for touched capabilities.
            4. Every scenario in the change has a matching test.
            5. tasks.md items claimed complete are actually implemented.
            6. Security smells (secrets, injection, authz gaps).
            Severity-tag each finding [blocker|should-fix|nit]. Do not comment
            on style a linter covers.
            Your final response text is NOT posted anywhere on its own — writing
            the review is not the same as publishing it. As your LAST action,
            you MUST run `gh pr comment --body "<your findings, formatted as
            markdown>"` (no PR number needed - it targets the current
            checked-out branch automatically). If you have zero findings, still
            post a short comment saying so. Skipping this step means the review
            had no effect, even if your analysis was correct.' || '' }}
          # 2026-08-11/12 (BLC-31): reproduced this exact silent-no-op twice
          # with show_full_output:true. Root cause, confirmed from the full
          # transcript, not guessed: the agent DID produce a complete, correct
          # review both times (visible in its own final "result" text) but
          # never once called gh pr comment/gh pr review, despite both being
          # allowed - it treated writing the analysis as the finished task
          # rather than an intermediate step before publishing it. The
          # action's own built-in "Post buffered inline comments" step (see
          # below) also reported "No buffered inline comments" both times -
          # that mechanism needs the agent to use it explicitly too, it does
          # not auto-extract a review from ordinary response text. Separately,
          # 3 of the agent's tool calls were denied both times (gh pr list,
          # gh pr view, find, env) - it kept trying to self-discover the PR
          # number via disallowed commands; the prompt above now states
          # explicitly that a bare `gh pr comment` targets the current branch,
          # removing the reason it was trying those in the first place. Fixed
          # by making "execute gh pr comment" an explicit mandatory final step
          # rather than trusting "post findings as PR review comments" to be
          # read as an instruction to run a tool, not just describe an outcome.
          claude_args: '--allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Bash(gh pr review:*),Read,Grep,Glob"'
