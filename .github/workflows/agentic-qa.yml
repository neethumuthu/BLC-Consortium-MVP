# Ring 3 — goal-driven QA against the staging environment.
#
# Added from the starter-kit template (2026-08-10), not just copied as-is —
# two fixes applied up front rather than left to be "discovered" via a live
# run, since both are already-proven requirements from the other four
# Claude-driven workflows in this repo, not new/uncertain territory:
#   1. id-token: write - missing from the template. Confirmed live
#      (context-gardener.yml/context-drift-check.yml) that claude-code-action
#      fails immediately ("Could not fetch an OIDC token") without it.
#   2. claude_code_oauth_token - the template only had anthropic_api_key.
#      All four other Claude-driven workflows in this repo use
#      CLAUDE_CODE_OAUTH_TOKEN; matching that rather than introducing a
#      fifth workflow with a different auth path.
#
# The template's `pull_request` trigger assumed per-PR preview-deploy
# infrastructure (Vercel/Render/etc.) that doesn't exist here - only one
# persistent staging environment does (blc31-staging.westeurope.cloudapp.azure.com,
# see docs/BUILD_LOG.md's Phase 15). Dropped `pull_request` entirely rather
# than point it at the shared staging URL (would let a PR run and the nightly
# run collide) or ship a known-broken placeholder target.
name: agentic-qa
on:
  # Nightly schedule re-enabled 2026-08-11, after staging was wiped and
  # redeployed fresh (see docs/BUILD_LOG.md's Phase 16 and
  # docs/ERROR_LOG.md) to clear out accumulated QA test data - two fake
  # institutions, a permanently-stuck test proposal, five QA-labeled
  # certificates - none of which the chaincode had any way to remove.
  # Fresh environment verified working end to end (3 real institutions,
  # QA_GUEST's read-only guard, the governance-vote-status feature) before
  # turning this back on.
  schedule:
    - cron: '0 3 * * *'        # nightly exploratory regression on staging
  workflow_dispatch: {}         # for manual live-testing, per the same
                                 # pattern as the other Claude-driven
                                 # workflows in this repo

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: target
        run: echo "url=${{ vars.STAGING_URL }}" >> "$GITHUB_OUTPUT"

      # First live run (2026-08-10) confirmed a real bug: the agent filed a
      # genuinely good, well-reasoned issue but couldn't apply the `qa-agent`
      # label — it doesn't exist in this repo, `gh issue create --label`
      # fails outright against a nonexistent label, and label creation is
      # outside the agent's own allowedTools (Bash(gh issue:*), not
      # Bash(gh label:*)). Same fix requirements-nudge.yml already applies
      # for its own `open-question` label - ensure it exists here too,
      # once, rather than depending on the agent to create it correctly.
      - name: Ensure qa-agent label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create qa-agent --repo "${{ github.repository }}" --color D93F0B \
            --description "Filed by the Ring 3 agentic-qa QA agent" 2>/dev/null || true

      # Snapshot before the agent runs, compared against the same query
      # after it finishes, so the Slack step below can tell "this run found
      # something new" apart from "this run found nothing, same as every
      # other night" - same class of fix already applied to
      # context-gardener.yml (only notify on an actual PR, not on every
      # success() regardless of outcome). Without this, an already-open
      # issue like #8 would trigger the identical Slack message every
      # single night for as long as it stays unresolved.
      - name: Snapshot qa-agent issues before this run
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label qa-agent --state all --json number --jq '.[].number' | sort -n > /tmp/qa-agent-before.txt

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the Ring 3 QA agent. Target: ${{ steps.target.outputs.url }}
            Log in ONLY with these credentials: email "qa-guest@blc31.internal",
            password "QaGuest!ReadOnly-8f2c" (the QA_GUEST account in
            frontend/src/lib/institutions.ts). Do not log in as any other
            institution, even if you find other real credentials elsewhere in
            the repo — this account is deliberately read-only (see
            context/codebase/TESTING.md's 2026-08-11 update) and must stay that
            way.
            Execute every goal under "Ring 3 QA goals" in context/codebase/TESTING.md,
            per that same update: for any goal describing a write action
            (propose/vote/issue/revoke/rotate), a 403 response is the correct,
            expected result for this account — do not file it as a defect, and
            do not try to work around it.
            Goals are intents — plan your own paths, including unhappy paths.
            For each finding: severity, type [bug|improvement|question] — bug:
            actually broken or incorrect right now, should just be fixed;
            improvement: not broken, but could be better, not urgent, shouldn't
            block anything; question: genuinely ambiguous, needs a human/product
            decision, don't guess at an answer — reproduction steps, expected vs
            actual (cite the spec scenario in openspec/specs/ if one exists).
            Prefix the issue title with the type tag, e.g. "[bug] <title>".
            File one GitHub issue per distinct defect (label: qa-agent) unless an
            open issue already covers it. Finish with a one-paragraph summary.
          claude_args: '--mcp-config .github/qa-mcp.json --allowedTools "mcp__playwright__*,Read,Grep,Bash(gh issue:*)"'

      - name: Check whether this run actually filed a new issue
        id: after
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label qa-agent --state all --json number --jq '.[].number' | sort -n > /tmp/qa-agent-after.txt
          NEW=$(comm -13 /tmp/qa-agent-before.txt /tmp/qa-agent-after.txt)
          if [ -n "$NEW" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "new_issues=$(echo "$NEW" | sed 's/^/#/' | paste -sd, -)" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack - new finding(s)
        if: steps.after.outputs.found == 'true'
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_QUALITY }}
          webhook-type: incoming-webhook
          payload: |
            text: "agentic-qa found new issue(s) on ${{ steps.target.outputs.url }}: ${{ steps.after.outputs.new_issues }} — ${{ github.server_url }}/${{ github.repository }}/issues?q=is%3Aissue+is%3Aopen+label%3Aqa-agent"

      # Silence on "ran fine, nothing new" is the whole point of this fix -
      # but silence on a genuine crash would be worse than the noise it
      # replaced, so failure still notifies, just with a different message.
      - name: Notify Slack - run failed
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_QUALITY }}
          webhook-type: incoming-webhook
          payload: |
            text: "agentic-qa run FAILED on ${{ steps.target.outputs.url }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
