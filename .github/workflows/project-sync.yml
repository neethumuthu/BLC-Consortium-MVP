# Keeps GitHub Projects stages in sync with the operating loop + Slack nudges
name: project-sync
on:
  pull_request:
    types: [opened, closed]
  push:
    branches: [main]
    paths: ['openspec/changes/**']
  schedule:
    - cron: '0 9 * * *'        # daily nudge sweep

env:
  PROJECT_NUMBER: '2'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
      repository-projects: write
    steps:
      # fetch-depth: 0 is required, not cosmetic — project-sync.sh diffs
      # before..after on push events to tell "new change folder" apart from
      # "modified" apart from "archived"; the default depth-1 checkout makes
      # that diff impossible.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage transitions, driven by gh CLI:
      #   change folder created on main        -> Stage: Propose
      #   change folder modified (spec agreed) -> Stage: Apply   (set by Align reviewer)
      #   PR opened referencing change-id      -> Stage: Verify
      #   PR merged                            -> Stage: Compound
      #   change archived                      -> Stage: Done
      - name: Sync stages
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}   # PAT with project scope
        run: |
          # Template: adapt the item lookup to your issue<->change-id convention
          # (issue body contains "Change-ID: <id>").
          bash .github/scripts/project-sync.sh "$PROJECT_NUMBER" "${{ github.event_name }}"

      # Nudge: merged >24h ago but change not archived => compound step pending.
      # Only changes with every tasks.md checkbox checked qualify - a change
      # still resolving open questions (certificate-licensing's exact
      # situation as of 2026-08-14) is legitimately in progress, not
      # forgotten, and must not trigger this. Dedupes across days via
      # .github/state/compound-nudge-sent.json so a still-pending change
      # gets nudged about once, not every single day it stays that way.
      - name: Compound nudges
        id: compound_nudges
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/compound-nudge.sh

      - name: Persist compound-nudge dedup state
        if: github.event_name == 'schedule' && steps.compound_nudges.outputs.newly_pending != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/state/compound-nudge-sent.json
          git diff --cached --quiet || git commit -m "chore: record compound-nudge dedup state"
          git push

      - uses: slackapi/slack-github-action@v2
        if: github.event_name == 'schedule' && steps.compound_nudges.outputs.newly_pending != ''
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_PIPELINE }}
          webhook-type: incoming-webhook
          payload: |
            text: "Compound step pending on: ${{ steps.compound_nudges.outputs.newly_pending }} — fully implemented (all tasks checked) but not yet archived, for over 24h: ${{ github.server_url }}/${{ github.repository }}/tree/main/openspec/changes"
